{% extends "layout.html" %}
{% block title %}Register - BrandGuard AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold">Create account</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('register') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 6 chars)</label>
            <input name="password" type="password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select">
              <option value="author">Author</option>
              <option value="reviewer">Reviewer</option>
              <option value="approver">Approver</option>
            </select>
          </div>
          <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="small text-muted mt-2 mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
      </div>
    </div>
  </div>
</div>

{% if error %}
<div class="modal fade show" id="errorModal" tabindex="-1" style="display:block; background:rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>Registration Failed</h5>
      </div>
      <div class="modal-body text-center">
        <p class="mb-2">{{ error }}</p>
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary" onclick="document.getElementById('errorModal').style.display='none';">
          <i class="bi bi-arrow-left me-1"></i>Try again
        </button>
      </div>
    </div>
  </div>
</div>
{% endif %}
{% endblock %}
